name: CI

on:
  pull_request:
  push:
    branches: ["**"]

env:
  FINTRACK_DATABASE_URL: postgresql+asyncpg://fintrack:change-me@localhost:5432/fintrack
  FINTRACK_TEST_DATABASE_URL: postgresql+asyncpg://fintrack:change-me@localhost:5432/fintrack
  FINTRACK_JWT_SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
  FINTRACK_REDIS_URL: redis://localhost:6379/0
  FINTRACK_TEST_REDIS_URL: redis://localhost:6379/15

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: fintrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy app tests

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests (unit + integration + API)
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t fintrack-api:ci .
